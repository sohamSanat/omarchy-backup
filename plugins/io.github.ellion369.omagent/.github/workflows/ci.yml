name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Python entry points and quality harness
        run: |
          python -m py_compile omagent-route
          python -m compileall -q harness_pool.py evaluation tests
      - name: Validate manifest and benchmark fixtures
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool model_pool.json >/dev/null
          python -m json.tool config/harnesses.json >/dev/null
          python -m json.tool schemas/event.schema.json >/dev/null
          python -m json.tool evaluation/direct/tasks.json >/dev/null
          python -m json.tool evaluation/web/tasks.json >/dev/null
          python -m json.tool evaluation/coding/tasks.json >/dev/null
          python -m json.tool evaluation/ui/tasks.json >/dev/null
      - name: Check executable entry point
        run: test -x omagent-route
      - name: Parse QML when Qt tools are available
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            qmllint Omagent.qml
          else
            echo "qmllint is not installed; QML parse gate skipped"
          fi
      - name: Run isolated characterization and quality-harness tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
