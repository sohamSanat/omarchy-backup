[package]
name = "hogreaper"
version = "0.1.0"
edition = "2024"
authors = ["Soham <soham@omarchy.org>"]
description = "Zero-overhead RAM and CPU governor daemon for Omarchy Linux"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libc = "0.2"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
