[package]
name = "craftcloud"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
libc = "0.2"
