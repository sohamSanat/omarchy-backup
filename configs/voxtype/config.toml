# Voxtype Configuration
#
# Location: ~/.config/voxtype/config.toml
# All settings can be overridden via CLI flags
#
# State file for external integrations (Waybar, polybar, etc.)
# Use "auto" for default location ($XDG_RUNTIME_DIR/voxtype/state),
# a custom path, or "disabled" to turn off. The daemon writes state
# ("idle", "recording", "transcribing") to this file whenever it changes.
# Required for `voxtype record toggle` and `voxtype status` commands.
state_file = "auto"

[hotkey]
# Hotkeys are configured in Hyprland compositor bindings
enabled = false

[osd]
# Disable built-in GTK4 OSD; Omarchy's native 'voxtype-aura' Quickshell plugin handles visual display
enabled = false

[audio]
# Audio input device ("default" uses PipeWire system default)
device = "default"

# Sample rate in Hz (whisper expects 16000)
sample_rate = 16000

# Maximum recording duration in seconds (safety limit)
max_duration_secs = 60

# Pause MPRIS media players during recording
pause_media = true

[audio.feedback]
# Enable subtle sound cues when recording starts/stops
enabled = true
theme = "subtle"
volume = 0.6

[whisper]
# Fast inference on Intel 11th Gen Core i5 (TigerLake AVX-512)
model = "base.en"
language = "en"
translate = false
threads = 4

[output]
# Primary output mode: "type" via wtype on Wayland
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
pre_type_delay_ms = 50

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
# Convert spoken punctuation (e.g. say "period" -> ".", "comma" -> ",")
spoken_punctuation = true
replacements = { "omarchy" = "Omarchy", "hyprland" = "Hyprland", "voxtype" = "Voxtype" }
